# cryptography is deliberately pinned <49 in upstream pyproject.toml:
# 49.x drops the universal2 macOS wheel (arm64-only), which breaks the
# Intel macOS release build's `uv sync --frozen`. Accepted upstream risk;
# revisit when upstream changes the pin.
